injectRequestHeaders:
    - name: X-Forwarded-Groups
      preserveRequestValue: false
      values:
        - claimSource:
            claim: groups
    - name: X-Forwarded-User
      preserveRequestValue: false
      values:
        - claimSource:
            claim: user
    - name: X-Forwarded-Email
      preserveRequestValue: false
      values:
        - claimSource:
            claim: email
    - name: X-Forwarded-Preferred-Username
      preserveRequestValue: false
      values:
        - claimSource:
            claim: preferred_username
    # APISIX admin key injected upstream. preserveRequestValue: false (default)
    # strips/replaces the browser's (empty) x-api-key header. Key loaded RAW
    # from file — secretSource.value (base64) is NOT decoded by v7.15.4.
    - name: X-API-KEY
      preserveRequestValue: false
      values:
        - secretSource:
            fromFile: /etc/oauth2-proxy/admin-key
injectResponseHeaders: []
metricsServer: {}
providers:
    - clientID: poc-client
      clientSecret: poc-secret
      oidcConfig:
        issuerURL: http://idp.localhost:8180/default
        insecureAllowUnverifiedEmail: false
        insecureSkipIssuerVerification: false
        # deliberate: replay protection relaxed — fine for the mock IdP PoC; do NOT carry into a real deployment
        insecureSkipNonce: true
        skipDiscovery: false
        emailClaim: email
        groupsClaim: groups
        userIDClaim: email
        audienceClaims:
            - aud
      id: oidc=poc-client
      provider: oidc
      loginURLParameters:
        - name: approval_prompt
          default:
            - force
      skipClaimsFromProfileURL: false
      code_challenge_method: S256
server:
    bindAddress: 0.0.0.0:4180
upstreamConfig:
    proxyRawPath: false
    upstreams:
        - id: /
          path: /
          uri: http://apisix:9180
          insecureSkipTLSVerify: false
          static: false
          flushInterval: 1s
          passHostHeader: true
          proxyWebSockets: true
          timeout: 30s
          disableKeepAlives: false
