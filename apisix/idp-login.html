<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
</head>
<body style="font-family: sans-serif; max-width: 24rem; margin: 4rem auto;">
<h1>Sign-in as dev</h1>
<form method="post">
  <p>
    <label for="username">Username</label><br>
    <input id="username" name="username" value="dev@example.com" style="width: 100%;">
  </p>
  <p>
    <label for="claims">Claims</label><br>
    <textarea id="claims" name="claims" rows="4" style="width: 100%;">{"email":"dev@example.com"}</textarea>
  </p>
  <p><button type="submit">Sign-in as dev</button></p>
</form>

<h1>Sign-in as alice</h1>
<form method="post">
  <p>
    <label>Username</label><br>
    <input name="username" value="alice">
  </p>
  <p>
    <label>Claims</label><br>
    <textarea name="claims" rows="5" cols="60">{"email":"alice@example.com"}</textarea>
  </p>
  <p><button type="submit">Sign-in as alice</button></p>
</form>
</body>
</html>
