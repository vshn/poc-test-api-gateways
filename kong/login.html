<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock OAuth2 Server Sign-in</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f0f2f5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 2rem;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  h2 { margin-bottom: .25rem; }
  p.hint { color: #666; font-size: .8rem; margin-bottom: 1.25rem; }
  label { display: block; font-size: .85rem; font-weight: 600; margin: 1rem 0 .25rem; }
  input[type="text"], textarea {
    width: 100%;
    padding: .5rem;
    border: 1px solid #bbb;
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: .85rem;
  }
  textarea { resize: vertical; min-height: 7rem; }
  button {
    margin-top: 1.25rem;
    width: 100%;
    padding: .6rem;
    border: 0;
    border-radius: 4px;
    background: #0366d6;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { background: #0250b2; }
</style>
</head>
<body>
<div class="card">
  <h2>Mock OAuth2 Server Sign-in</h2>
  <p class="hint">Prefilled for POC — edit if needed.</p>
  <form method="post">
    <label for="username">Username</label>
    <input id="username" type="text" name="username" required autofocus>
    <label for="claims">Claims (JSON)</label>
    <textarea id="claims" name="claims"></textarea>
    <button type="submit">Sign-in</button>
  </form>
</div>
<script>
  document.getElementById('username').value = 'dev@example.com';
  document.getElementById('claims').value = JSON.stringify({email: 'dev@example.com'}, null, 2);
</script>
</body>
</html>
